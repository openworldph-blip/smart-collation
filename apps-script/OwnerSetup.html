<!doctype html><html><head><base target="_top"><style>body{font:15px Arial;padding:15px;color:#352a24}label{display:block;margin:12px 0}input{display:block;padding:10px;box-sizing:border-box;width:100%;font:16px Arial}button{padding:12px;background:#cf4221;color:white;border:0;border-radius:7px}p{line-height:1.5}#status{font-size:13px}</style></head><body><p>Create the Admin password. Use at least 8 characters.</p><form id="form"><label>New password<input id="pw" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><label>Confirm password<input id="repeat" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><button id="save">Save Admin password</button><p id="status" role="status"></p></form><script>
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw'),repeat=document.getElementById('repeat'),status=document.getElementById('status'),button=document.getElementById('save');if(pw.value!==repeat.value){status.textContent='Passwords do not match.';return;}button.disabled=true;status.textContent='Saving…';try{const salt=crypto.getRandomValues(new Uint8Array(16)),key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveBits']),result=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:160000},key,256)),hex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');google.script.run.withSuccessHandler(()=>{pw.value='';repeat.value='';status.textContent='Admin password saved. You can close this window.';button.disabled=false;}).withFailureHandler(err=>{status.textContent=err.message;button.disabled=false;}).saveOwnerAdminPassword({salt:hex(salt),hash:hex(result),iterations:160000});}catch(err){status.textContent=err.message;button.disabled=false;}};
</script></body></html>
